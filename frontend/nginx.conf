server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend lives at the "backend" service on the compose network --
    # trailing slash on both sides strips the /api/ prefix, same rewrite
    # vite's dev proxy does (see frontend/vite.config.ts), so the axios
    # client's baseURL: "/api" needs no changes between dev and prod.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router) -- unknown paths fall back to
    # index.html instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
